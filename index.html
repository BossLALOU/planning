<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Révisions</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Révisions">
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --accent:#0f172a; --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; --info:#2563eb;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 13px;background:#e2e8f0;color:var(--ink)}
button:active{transform:scale(.97)}
button.primary{background:var(--accent);color:#fff}
button.ok{background:var(--ok);color:#fff}
button.ghost{background:transparent;border:1px solid var(--line)}
button.small{padding:5px 9px;font-size:13px}
input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;background:#fff;color:var(--ink)}
textarea{min-height:180px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
header h1{margin:0 0 8px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
header h1 small{font-weight:400;font-size:12px;opacity:.7}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{background:transparent;color:#cbd5e1;border-radius:10px 10px 0 0;padding:8px 12px;white-space:nowrap}
nav button.on{background:var(--bg);color:var(--ink);font-weight:600}
main{max-width:760px;margin:0 auto;padding:14px 12px calc(env(safe-area-inset-bottom) + 40px)}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.tiny{font-size:12px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 6px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav strong{font-size:17px;text-transform:capitalize}
.bar{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.habit{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);cursor:pointer;flex:1;min-width:140px;user-select:none}
.habit .box{width:22px;height:22px;border-radius:7px;border:2px solid #94a3b8;display:grid;place-items:center;font-size:14px;color:#fff}
.habit.on{background:#dcfce7;border-color:#86efac}
.habit.on .box{background:var(--ok);border-color:var(--ok)}
.block{display:flex;gap:0;background:var(--card);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.block .stripe{width:7px;flex:none}
.block .body{padding:11px 13px;flex:1;min-width:0}
.block .time{font-size:12px;color:var(--muted);font-weight:600}
.block .label{font-weight:600;margin:2px 0}
.block .method{font-size:13px;color:var(--muted)}
.block .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.block.done{opacity:.6}
.block.done .label{text-decoration:line-through}
.block.skipped{opacity:.45}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.02em}
.pill.obl{background:#fee2e2;color:#b91c1c}
.pill.bonus{background:#dbeafe;color:#1d4ed8}
.pill.subj{color:#fff}
.pill.fb-compris{background:#dcfce7;color:#166534}
.pill.fb-flou{background:#fef3c7;color:#92400e}
.pill.fb-pas_compris{background:#fee2e2;color:#991b1b}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:#f8fafc;border:1px solid var(--line);font-size:13px;margin:0 6px 6px 0}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week .col{background:var(--card);border-radius:12px;padding:8px 6px;min-height:120px;cursor:pointer}
.week .col.today{outline:2px solid var(--accent)}
.week .col h4{margin:0 0 6px;font-size:12px;text-align:center;text-transform:capitalize}
.week .mini{font-size:11px;padding:3px 5px;border-radius:6px;margin-bottom:4px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week .mini.done{opacity:.45;text-decoration:line-through}
@media (max-width:640px){.week{grid-template-columns:1fr}.week .col{min-height:0}.week .col h4{text-align:left}}
.chapter{padding:9px 0;border-top:1px solid var(--line)}
.chapter:first-of-type{border-top:0}
.stat{flex:1;min-width:120px;background:#f8fafc;border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px}
/* overlay */
#ov{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;display:none}
#ov.on{display:block}
#ov .wrap{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 60px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.opt .let{flex:none;width:26px;height:26px;border-radius:8px;background:#e2e8f0;display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.sel{border-color:var(--info);background:#eff6ff}
.opt.sel .let{background:var(--info);color:#fff}
.opt.good{border-color:var(--ok);background:#f0fdf4}
.opt.good .let{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fef2f2}
.opt.wrong .let{background:var(--bad);color:#fff}
.expl{background:#fffbeb;border-left:4px solid var(--warn);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
.flash{min-height:180px;display:grid;place-items:center;text-align:center;font-size:17px;padding:22px}
.fiche img{max-width:100%}
.fiche table{border-collapse:collapse;width:100%;margin:8px 0}
.fiche td,.fiche th{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.err{color:var(--bad);font-size:13px}
.okmsg{color:var(--ok);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 16px;border-radius:12px;z-index:50;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#login{max-width:380px;margin:12vh auto;padding:0 16px}
/* emploi du temps horaire */
.tt{overflow:auto;background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(15,23,42,.06);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ttgrid{display:grid;grid-template-columns:44px repeat(7,minmax(108px,1fr));min-width:800px}
.ttcorner,.tthead{position:sticky;top:0;z-index:3;background:var(--card);border-bottom:1px solid var(--line);padding:6px 4px;font-size:12px;font-weight:600;text-align:center;text-transform:capitalize}
.ttcorner{left:0;z-index:4}
.tthead{cursor:pointer}
.tthead.today span{background:var(--accent);color:#fff;border-radius:99px;padding:1px 8px}
.tthead .mini{margin-top:4px;text-align:left;font-weight:400}
.ttaxis{position:sticky;left:0;z-index:2;background:var(--card);border-right:1px solid var(--line)}
.ttaxis div{position:absolute;right:6px;transform:translateY(-6px);font-size:11px;color:var(--muted)}
.ttaxis div:first-child{transform:none}
.ttcol{position:relative;border-right:1px solid var(--line)}
.ttcol.today{background:#f8fafc}
.ttline{position:absolute;left:0;right:0;border-top:1px dashed #e2e8f0}
.ev{position:absolute;left:3px;right:3px;border-radius:8px;color:#fff;font-size:11.5px;line-height:1.25;padding:4px 6px;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.ev .evsub{opacity:.85;font-size:10.5px}
.ev.done{opacity:.45;text-decoration:line-through}
.ev.skip{opacity:.3}
/* matières */
.subgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.subcard{cursor:pointer;margin:0}
.modrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.modrow:first-of-type{border-top:0}
.modrow .go{color:var(--muted);font-size:13px}
.score{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.score.g{background:#dcfce7;color:#166534}.score.o{background:#fef3c7;color:#92400e}.score.r{background:#fee2e2;color:#991b1b}.score.n{background:#f1f5f9;color:var(--muted);font-weight:500}
details summary{cursor:pointer}

</style>
</head>
<body>
<div id="app"></div>
<div id="ov"><div class="wrap" id="ovc"></div></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* ================= CONFIG ================= */
const SUPABASE_URL = "https://ywtgiricbanxmsodosxb.supabase.co";
const SUPABASE_KEY = "sb_publishable_XCPJqn69HadgqzswqR1fnw_yXiBaOkn";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= UTILS ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const frDay = (s, opt={weekday:"long", day:"numeric", month:"long"}) => parse(s).toLocaleDateString("fr-FR", opt);
const isWeekday = s => { const w = parse(s).getDay(); return w>=1 && w<=5; };
const mondayOf = s => { const d = parse(s); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return ymd(d); };
const hm = t => t ? t.slice(0,5).replace(":","h") : "";
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
async function q(promise){ const { data, error } = await promise; if (error){ console.error(error); toast("Erreur : "+error.message); throw error; } return data; }

const KIND_LABEL = { lecture:"Lecture", flashcards:"Flashcards", qcm:"QCM", exos:"Exos", tp:"TP", rattrapage:"Rattrapage", bilan:"Bilan", fiche:"Fiche" };
const FB = { compris:"Compris", flou:"Flou", pas_compris:"Pas compris" };
const LADDER = [1,3,7,14,30];

/* ================= STATE ================= */
const S = { view:"today", day: today(), subjects:new Map(), chapters:new Map(), user:null, subject:null };

async function loadRefs(){
  const [subs, chs] = await Promise.all([
    q(sb.from("rev_subjects").select("*").order("family").order("name")),
    q(sb.from("rev_chapters").select("*").order("position"))
  ]);
  S.subjects = new Map(subs.map(s=>[s.id,s]));
  S.chapters = new Map(chs.map(c=>[c.id,c]));
}
const colorOf = b => S.subjects.get(b.subject_id)?.color || (b.chapter_id && S.subjects.get(S.chapters.get(b.chapter_id)?.subject_id)?.color) || "#94a3b8";

/* ================= AUTH ================= */
function renderLogin(msg=""){
  $("#app").innerHTML = `
  <div id="login" class="card">
    <h2>Révisions</h2>
    <p class="muted tiny">Connecte-toi avec le compte créé dans Supabase.</p>
    <form id="lf">
      <input id="em" type="email" placeholder="Email" autocomplete="username" required style="margin-bottom:8px">
      <input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" required style="margin-bottom:10px">
      <button class="primary" style="width:100%">Se connecter</button>
      <p class="err">${esc(msg)}</p>
    </form>
  </div>`;
  $("#lf").onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $("#em").value.trim(), password: $("#pw").value });
    if (error) renderLogin("Connexion impossible : " + error.message);
  };
}

/* ================= SHELL ================= */
const VIEWS = [["today","Aujourd'hui"],["week","Semaine"],["subjects","Matières"],["import","Importer"],["results","Résultats"]];
function shell(){
  $("#app").innerHTML = `
  <header>
    <h1>📚 Révisions <small id="streak"></small></h1>
    <nav>${VIEWS.map(([k,l])=>`<button data-v="${k}" class="${S.view===k?"on":""}">${l}</button>`).join("")}</nav>
  </header>
  <main id="main"></main>`;
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => { S.view = b.dataset.v; if (S.view==="today") S.day = today(); if (S.view==="subjects") S.subject = null; render(); });
}
async function render(){
  document.body.style.overflow = "";
  shell();
  updateStreak();
  const m = $("#main"); m.innerHTML = `<p class="muted">Chargement…</p>`;
  try{
    if (S.view==="today") await viewToday(m);
    else if (S.view==="week") await viewWeek(m);
    else if (S.view==="subjects") await viewSubjects(m);
    else if (S.view==="import") viewImport(m);
    else if (S.view==="results") viewResults(m);
  }catch(e){ m.innerHTML = `<p class="err">${esc(e.message||e)}</p>`; }
}

/* ================= STREAK ================= */
async function updateStreak(){
  const since = addDays(today(), -90);
  const rows = await q(sb.from("rev_blocks").select("day,status,priority").gte("day", since).lte("day", today()));
  const byDay = {};
  rows.filter(r=>r.priority==="obligatoire" && r.status!=="moved").forEach(r => (byDay[r.day] ??= []).push(r.status));
  let streak = 0, d = today();
  const okDay = d => byDay[d] && byDay[d].every(s=>s==="done");
  if (!okDay(d)) d = addDays(d,-1); // aujourd'hui pas fini : on ne casse pas la série
  for (let i=0;i<90;i++, d=addDays(d,-1)){
    if (!byDay[d]) continue;          // jour sans obligatoire : neutre
    if (okDay(d)) streak++; else break;
  }
  const el = $("#streak"); if (el) el.textContent = streak ? `🔥 ${streak} jour${streak>1?"s":""}` : "";
}

/* ================= TODAY ================= */
async function viewToday(m){
  const day = S.day, isToday = day===today();
  const [blocks, habits, late, dueCards] = await Promise.all([
    q(sb.from("rev_blocks").select("*").eq("day", day).order("start_time", {nullsFirst:false})),
    q(sb.from("rev_habits").select("*").eq("day", day)),
    isToday ? q(sb.from("rev_blocks").select("*").lt("day", day).eq("status","todo").order("day")) : Promise.resolve([]),
    q(sb.from("rev_cards").select("id", {count:"exact", head:false}).lte("due", day))
  ]);
  const hset = new Set(habits.filter(h=>h.done).map(h=>h.habit));
  const visible = blocks.filter(b=>b.status!=="moved");
  const obl = visible.filter(b=>b.priority==="obligatoire");
  const oblDone = obl.filter(b=>b.status==="done").length;
  const pct = obl.length ? Math.round(oblDone/obl.length*100) : 0;
  const dueCh = [...S.chapters.values()].filter(c=>c.next_review && c.next_review<=day);

  const habitsHtml = [["calisthenie","💪 Calisthénie (15 min)"]]
    .map(([k,l])=>`<div class="habit ${hset.has(k)?"on":""}" data-h="${k}"><span class="box">${hset.has(k)?"✓":""}</span>${l}</div>`).join("");

  m.innerHTML = `
  <div class="card">
    <div class="daynav">
      <button class="ghost small" id="prev">‹</button>
      <div style="text-align:center"><strong>${esc(frDay(day))}</strong>${isToday?"":`<br><a href="#" id="gotoday" class="tiny">revenir à aujourd'hui</a>`}</div>
      <button class="ghost small" id="next">›</button>
    </div>
  </div>
  <div class="card">
    <div class="row">${habitsHtml}</div>
    ${obl.length?`<div style="margin-top:12px"><div class="row between tiny"><span>Obligatoires</span><span>${oblDone}/${obl.length}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`:""}
  </div>
  ${late.length?`<div class="card" style="border-left:5px solid var(--warn)"><h3>⏳ En retard (${late.length})</h3>${late.map(b=>`
    <div class="row between" style="padding:6px 0;border-top:1px solid var(--line)">
      <div style="min-width:0"><span class="dot" style="background:${colorOf(b)}"></span> <b>${esc(b.label)}</b> <span class="muted tiny">· ${esc(frDay(b.day,{weekday:"short",day:"numeric"}))}</span></div>
      <div class="row"><button class="small" data-mv="${b.id}" data-to="${day}">Faire aujourd'hui</button><button class="small ghost" data-skip="${b.id}">Abandonner</button></div>
    </div>`).join("")}</div>`:""}
  ${(dueCards.length||dueCh.length)?`<div class="card"><h3>🔁 Révisions espacées</h3>
    ${dueCards.length?`<button class="primary" id="revcards">Flashcards dues : ${dueCards.length}</button>`:""}
    ${dueCh.length?`<div style="margin-top:10px">${dueCh.map(c=>`<span class="chip"><span class="dot" style="background:${S.subjects.get(c.subject_id)?.color}"></span>${esc(c.title)}</span>`).join("")}<div class="tiny muted">Chapitres à revoir (prévu par la répétition espacée)</div></div>`:""}
  </div>`:""}
  <div id="blocks">${(visible.length||isWeekday(day))?[...visible.map(blockHtml), ...(isWeekday(day)?[sportHtml(hset.has("sport"))]:[])].join(""):`<div class="card muted">Aucun bloc prévu ce jour-là.</div>`}</div>`;

  $("#prev").onclick = ()=>{ S.day = addDays(day,-1); render(); };
  $("#next").onclick = ()=>{ S.day = addDays(day,1); render(); };
  $("#gotoday") && ($("#gotoday").onclick = e=>{ e.preventDefault(); S.day=today(); render(); });
  m.querySelectorAll(".habit").forEach(el => el.onclick = async ()=>{
    const k = el.dataset.h;
    if (hset.has(k)) await q(sb.from("rev_habits").delete().eq("day",day).eq("habit",k));
    else await q(sb.from("rev_habits").upsert({ day, habit:k, done:true, user_id:S.user.id }));
    render();
  });
  $("#revcards") && ($("#revcards").onclick = ()=> runCards({ due:day }));
  $("#sportbtn") && ($("#sportbtn").onclick = async ()=>{
    if (hset.has("sport")) await q(sb.from("rev_habits").delete().eq("day",day).eq("habit","sport"));
    else await q(sb.from("rev_habits").upsert({ day, habit:"sport", done:true, user_id:S.user.id }));
    render();
  });
  bindBlockActions(m, blocks.concat(late));
}

const SPORT = { start:"19:00", end:"21:00", color:"#e11d48" };
function sportHtml(done){
  return `<div class="block ${done?"done":""}">
    <div class="stripe" style="background:${SPORT.color}"></div>
    <div class="body">
      <div class="row between"><span class="time">${hm(SPORT.start)} – ${hm(SPORT.end)} · Sport</span></div>
      <div class="label">🏋️ Séance de sport</div>
      <div class="acts">${done?`<button class="small ghost" id="sportbtn">Annuler</button>`:`<button class="ok small" id="sportbtn">✓ Fait</button>`}</div>
    </div></div>`;
}

function blockHtml(b){
  const ch = S.chapters.get(b.chapter_id), sub = S.subjects.get(b.subject_id || ch?.subject_id);
  const time = b.start_time ? `${hm(b.start_time)}${b.end_time?" – "+hm(b.end_time):""}` : "";
  return `<div class="block ${b.status}">
    <div class="stripe" style="background:${colorOf(b)}"></div>
    <div class="body">
      <div class="row between"><span class="time">${time} ${KIND_LABEL[b.kind]?"· "+KIND_LABEL[b.kind]:""}</span>
        <span>${b.moved_from?`<span class="pill" style="background:#fef3c7;color:#92400e">reporté</span> `:""}<span class="pill ${b.priority==="obligatoire"?"obl":"bonus"}">${b.priority==="obligatoire"?"OBLIGATOIRE":"BONUS"}</span></span></div>
      <div class="label">${esc(b.label)}</div>
      ${sub?`<span class="pill subj" style="background:${sub.color}">${esc(sub.name)}</span> `:""}${ch?`<span class="tiny muted">${esc(ch.title)}</span>`:""}
      ${b.method?`<div class="method">🧭 ${esc(b.method)}</div>`:""}
      ${b.feedback?`<div style="margin-top:6px"><span class="pill fb-${b.feedback}">${FB[b.feedback]}</span></div>`:""}
      <div class="acts">
        ${b.status==="todo" ? `
          ${b.module_id?`<button class="primary small" data-run="${b.id}">▶ Lancer</button>`:""}
          <button class="ok small" data-done="${b.id}">✓ Fait</button>
          <button class="small" data-mv="${b.id}" data-to="${addDays(b.day,1)}">↷ Demain</button>
          <button class="small ghost" data-skip="${b.id}">✕ Sauter</button>`
        : `<button class="small ghost" data-undo="${b.id}">Annuler</button>`}
      </div>

/* ================= CHAPTER ADAPTATION ================= */
async function updateChapter(chapterId, pct, weight=0.4){
  const c = S.chapters.get(chapterId); if (!c) return;
  const first = !c.last_review && c.mastery===0;
  const mastery = Math.max(0, Math.min(100, Math.round(first ? pct : (1-weight)*c.mastery + weight*pct)));
  let idx = LADDER.findIndex(x=>x>=(c.interval_days||1)); if (idx<0) idx = LADDER.length-1;
  if (pct>=80) idx = Math.min(idx+1, LADDER.length-1);
  else if (pct<50) idx = 0;
  const interval = LADDER[idx];
  let level = c.level||1;
  if (pct>=85 && level<3) level++;
  else if (pct<50 && level>1) level--;
  const stage = mastery>=90 && interval>=14 ? "entretien" : mastery>=75 ? "consolidation" : mastery>=50 ? "application" : "ancrage";
  const upd = { mastery, interval_days:interval, level, stage, last_review:today(), next_review:addDays(today(), interval) };
  await q(sb.from("rev_chapters").update(upd).eq("id", chapterId));
  Object.assign(c, upd);
}

async function runModule(moduleId, block=null){
  const [mod] = await q(sb.from("rev_modules").select("*").eq("id", moduleId));
  if (!mod) return toast("Module introuvable — importe-le d'abord");
  if (mod.type==="qcm" || mod.type==="lecture_quiz") return runQcm(mod, block);
  if (mod.type==="exo") return runExo(mod, block);
  if (mod.type==="flashcards") return runCards({ moduleId: mod.id, block });
  if (mod.type==="fiche") return runFiche(mod, block);
}

async function finishAttempt({ mod=null, chapterId, block, score, max, details, started, weight=0.4 }){
  await q(sb.from("rev_attempts").insert({
    module_id: mod?.id ?? null, chapter_id: chapterId ?? null, block_id: block?.id ?? null,
    score, max_score:max, duration_s: Math.round((Date.now()-started)/1000), details
  }));

  if (block) await q(sb.from("rev_blocks").update({ status:"done", done_at:new Date().toISOString() }).eq("id", block.id));
  return Math.round(pct);
}

function runQcm(mod, block){
  const qs = mod.content.questions; const started = Date.now();
  let i = 0, score = 0; const details = [];
  const step = () => {
    const Q = qs[i]; const sel = new Set();
    openOv(`
      <div class="row between"><button class="ghost small" id="quit">✕ Quitter</button><span class="muted tiny">${esc(mod.title)} · ${i+1}/${qs.length}</span></div>
      <div class="bar" style="margin:10px 0 14px"><i style="width:${i/qs.length*100}%"></i></div>
      <div class="card"><b>${esc(Q.text)}</b>${(Q.answer||[]).length>1?`<div class="tiny muted">Plusieurs réponses possibles</div>`:""}</div>
      ${Q.options.map((o,k)=>`<button class="opt" data-k="${k}"><span class="let">${"ABCDEFGH"[k]}</span><span>${esc(o)}</span></button>`).join("")}
      <div id="fbk"></div>
      <button class="primary" id="val" style="width:100%;margin-top:6px">Valider</button>`);
    $("#quit").onclick = ()=>{ if (confirm("Quitter ? Les réponses ne seront pas enregistrées.")) closeOv(); };
    let locked = false;
    document.querySelectorAll(".opt").forEach(el => el.onclick = ()=>{
      if (locked) return; const k=+el.dataset.k;
      sel.has(k) ? sel.delete(k) : sel.add(k); el.classList.toggle("sel");
    });
    $("#val").onclick = async ()=>{
      if (!locked){
        locked = true;
        const good = new Set(Q.answer);
        const ok = good.size===sel.size && [...good].every(x=>sel.has(x));
        if (ok) score++;
        details.push({ q: Q.id ?? i, chosen:[...sel], correct:[...good], ok });
        document.querySelectorAll(".opt").forEach(el=>{
          const k=+el.dataset.k; el.classList.remove("sel");
          if (good.has(k)) el.classList.add("good"); else if (sel.has(k)) el.classList.add("wrong");
        });
        $("#fbk").innerHTML = `<p style="font-weight:700;color:${ok?"var(--ok)":"var(--bad)"}">${ok?"✓ Juste":"✗ Faux"}</p>${Q.explanation?`<div class="expl">${esc(Q.explanation)}</div>`:""}`;
        $("#val").textContent = i<qs.length-1 ? "Question suivante →" : "Voir le résultat";
      } else {
        i++;
        if (i<qs.length) step();
        else { const pct = await finishAttempt({ mod, chapterId:mod.chapter_id, block, score, max:qs.length, details, started });
               endScreen(mod.title, pct, `<p class="muted">${score}/${qs.length} questions justes</p>`); }
      }
    };
  };
  step();
}

/* ---- Flashcards : répétition espacée carte par carte ---- */
function schedule(c, g){
  let { ease=2.5, interval=0, reps=0, lapses=0 } = c;
  if (g===0){ lapses++; reps=0; interval=1; ease=Math.max(1.3, ease-0.2); }
  else if (g===1){ interval=Math.max(1, Math.round(interval*1.2)); ease=Math.max(1.3, ease-0.15); reps++; }
  else if (g===2){ interval = reps===0?1 : reps===1?3 : Math.round(interval*ease); reps++; }
  else { interval = reps===0?3 : Math.round(Math.max(interval,1)*ease*1.3); ease+=0.15; reps++; }
  return { ease:+ease.toFixed(2), interval, reps, lapses, due:addDays(today(), interval) };
}

async function runCards({ moduleId=null, due=null, block=null, chapterId=null }){
  let query = sb.from("rev_cards").select("*");
  if (moduleId) query = query.eq("module_id", moduleId);
  if (chapterId) query = query.eq("chapter_id", chapterId);
  let cards = await q(query.order("due"));
  if (due) cards = cards.filter(c=>c.due<=due);
  else if (moduleId || chapterId){ const d = cards.filter(c=>c.due<=today()); if (d.length) cards = d; }
  cards = cards.slice(0, 60);
  if (!cards.length) return toast("Aucune carte à réviser 🎉");
  const started = Date.now(); const queue = [...cards]; const again = new Set(); const results = [];
  const step = () => {
    if (!queue.length) return end();
    const c = queue[0]; const ch = S.chapters.get(c.chapter_id);
    openOv(`
      <div class="row between"><button class="ghost small" id="quit">✕ Quitter</button><span class="muted tiny">Reste ${queue.length}</span></div>
      <div class="tiny muted" style="margin-top:10px">${esc(ch?.title||"")}</div>
      <div class="card flash"><div>${esc(c.question)}</div></div>
      <div id="ans"></div>
      <button class="primary" id="flip" style="width:100%">Voir la réponse</button>`);
    $("#quit").onclick = ()=>{ closeOv(); if (results.length) end(); };
    $("#flip").onclick = ()=>{
      $("#flip").remove();
      $("#ans").innerHTML = `<div class="card flash" style="border-top:4px solid var(--ok)"><div style="white-space:pre-wrap">${esc(c.answer)}</div></div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
          <button style="background:var(--bad);color:#fff" data-g="0">Raté</button>
          <button style="background:var(--warn);color:#fff" data-g="1">Difficile</button>
          <button class="ok" data-g="2">Bien</button>
          <button style="background:var(--info);color:#fff" data-g="3">Facile</button></div>`;
      document.querySelectorAll("[data-g]").forEach(el=> el.onclick = async ()=>{
        const g = +el.dataset.g; queue.shift();
        const upd = schedule(c, g);
        await q(sb.from("rev_cards").update(upd).eq("id", c.id));
        await q(sb.from("rev_card_reviews").insert({ card_id:c.id, grade:g }));
        Object.assign(c, upd);
        if (!again.has(c.id)) results.push({ card:c.id, chapter:c.chapter_id, g });
        if (g===0 && !again.has(c.id)){ again.add(c.id); queue.push(c); }
        step();
      });
    };
  };
  const end = async () => {
    // une tentative par chapitre (impact plus léger sur la maîtrise que les QCM)
    const byCh = {};
    results.forEach(r => (byCh[r.chapter] ??= []).push(r));
    let tot=0, ok=0;
    for (const [ch, rs] of Object.entries(byCh)){
      const good = rs.filter(r=>r.g>=2).length; tot+=rs.length; ok+=good;
      await finishAttempt({ mod: moduleId?{id:moduleId}:null, chapterId:ch, block:null, score:good, max:rs.length,
        details: rs.map(r=>({card:r.card, g:r.g})), started, weight:0.25 });
    }
    if (block) await q(sb.from("rev_blocks").update({ status:"done", done_at:new Date().toISOString() }).eq("id", block.id));
    endScreen("Flashcards", tot?Math.round(ok/tot*100):0, `<p class="muted">${ok}/${tot} cartes « Bien » ou « Facile » du premier coup</p>`);
  };
  step();
}

/* ================= WEEK (emploi du temps horaire) ================= */
const TT = { from:7, to:21, h:52 };   // 7h → 21h, 52 px par heure
const toH = t => { const [a,b] = t.split(":").map(Number); return a + b/60; };
async function viewWeek(m){
  const mon = mondayOf(S.day), sun = addDays(mon, 6);
  const [blocks, habits] = await Promise.all([
    q(sb.from("rev_blocks").select("*").gte("day", mon).lte("day", sun).order("start_time",{nullsFirst:false})),
    q(sb.from("rev_habits").select("*").gte("day", mon).lte("day", sun))
  ]);
  const vis = blocks.filter(b=>b.status!=="moved");
  const obl = vis.filter(b=>b.priority==="obligatoire");
  const rate = obl.length ? Math.round(obl.filter(b=>b.status==="done").length/obl.length*100) : 0;
  const sportDays = new Set(habits.filter(h=>h.habit==="sport").map(h=>h.day));
  const days = [...Array(7)].map((_,i)=>addDays(mon,i));
  const hours = [...Array(TT.to-TT.from)].map((_,i)=>TT.from+i);
  const H = (TT.to-TT.from)*TT.h;

  const ev = (d, top, height, color, html, cls="", attrs="") =>
    `<div class="ev ${cls}" style="top:${top}px;height:${Math.max(height-2,18)}px;background:${color}" ${attrs}>${html}</div>`;

  const cols = days.map(d=>{
    const bs = vis.filter(b=>b.day===d);
    const timed = bs.filter(b=>b.start_time), untimed = bs.filter(b=>!b.start_time);
    const evs = timed.map(b=>{
      const s = Math.max(toH(b.start_time), TT.from), e = b.end_time ? Math.min(toH(b.end_time), TT.to) : s+1;
      const sub = S.subjects.get(b.subject_id);
      return ev(d, (s-TT.from)*TT.h, (e-s)*TT.h, colorOf(b),
        `<b>${hm(b.start_time)}${b.end_time?"–"+hm(b.end_time):""}</b> ${b.priority==="bonus"?"◦ ":""}${esc(b.label)}${sub?`<br><span class="evsub">${esc(sub.name)}</span>`:""}`,
        b.status==="done"?"done":b.status==="skipped"?"skip":"", `data-d="${d}"`);
    });
    if (isWeekday(d)) evs.push(ev(d, (toH(SPORT.start)-TT.from)*TT.h, (toH(SPORT.end)-toH(SPORT.start))*TT.h, SPORT.color,
      `<b>19h–21h</b> 🏋️ Sport`, sportDays.has(d)?"done":"", `data-d="${d}"`));
    return `<div class="ttcol ${d===today()?"today":""}" style="height:${H}px">
      ${hours.map(h=>`<div class="ttline" style="top:${(h-TT.from)*TT.h}px"></div>`).join("")}
      ${evs.join("")}</div>`;
  }).join("");
  const heads = days.map(d=>{
    const un = vis.filter(b=>b.day===d && !b.start_time);
    return `<div class="tthead ${d===today()?"today":""}" data-d="${d}"><span>${esc(frDay(d,{weekday:"short",day:"numeric"}))}</span>
      ${un.map(b=>`<div class="mini ${b.status==="done"?"done":""}" style="background:${colorOf(b)}">${esc(b.label)}</div>`).join("")}</div>`;
  }).join("");

  m.innerHTML = `
  <div class="card" style="padding:10px 12px;margin-bottom:8px">
    <div class="daynav">
      <button class="ghost small" id="pw">‹</button>
      <div style="text-align:center"><strong style="font-size:15px">Semaine du ${esc(frDay(mon,{day:"numeric",month:"long"}))}</strong>
        <div class="tiny muted">Obligatoires faits : <b>${rate}%</b> (objectif 80 %) · Sport ${sportDays.size}/5</div></div>
      <button class="ghost small" id="nw">›</button>
    </div>
  </div>
  <div class="tt" id="tt">
    <div class="ttgrid">
      <div class="ttcorner"></div>${heads}
      <div class="ttaxis" style="height:${H}px">${hours.map(h=>`<div style="top:${(h-TT.from)*TT.h}px">${h}h</div>`).join("")}</div>${cols}
    </div>
  </div>`;
  m.style.paddingBottom = "0"; document.body.style.overflow = "hidden";
  const tt = $("#tt");
  const fit = () => { if (!tt.isConnected) return window.removeEventListener("resize", fit);
    tt.style.height = Math.max(260, window.innerHeight - tt.getBoundingClientRect().top - 12) + "px"; };
  fit(); window.addEventListener("resize", fit);
  // centre la colonne d'aujourd'hui sur petit écran
  const tcol = tt.querySelector(".tthead.today"); if (tcol) tt.scrollLeft = Math.max(0, tcol.offsetLeft - 60);
  $("#pw").onclick = ()=>{ S.day = addDays(mon,-7); render(); };
  $("#nw").onclick = ()=>{ S.day = addDays(mon,7); render(); };
  tt.querySelectorAll("[data-d]").forEach(el=> el.onclick = ()=>{ S.day = el.dataset.d; S.view="today"; render(); });
}

async function viewSubjects(m){

  const avgOf = chs => chs.length ? Math.round(chs.reduce((a,c)=>a+c.mastery,0)/chs.length) : 0;

    }).join("")}</div>`;
    m.querySelectorAll("[data-s]").forEach(el=> el.onclick = ()=>{ S.subject = el.dataset.s; render(); });
    return;
  }

  /* --- détail d'une matière --- */
  const s = S.subjects.get(S.subject), chs = chOf(s.id), ids = new Set(chs.map(c=>c.id));
  const smods = mods.filter(x=>ids.has(x.chapter_id));
  const last = {}; attempts.forEach(a=>{ if (a.module_id && !last[a.module_id]) last[a.module_id] = a; });
  const best = {}; attempts.forEach(a=>{ if (!a.module_id || !a.max_score) return; const p = Math.round(a.score/a.max_score*100); best[a.module_id] = Math.max(best[a.module_id]??0, p); });
  const chTitle = id => S.chapters.get(id)?.title || "";
  const scoreTag = id => last[id] ? `<span class="score ${best[id]>=80?"g":best[id]>=50?"o":"r"}">${Math.round(last[id].score/last[id].max_score*100)}%</span>` : `<span class="score n">à faire</span>`;
  const section = (type, label) => {
    if (type==="flashcards"){
      const per = chs.map(c=>({ c, n:cards.filter(k=>k.chapter_id===c.id).length, due:cards.filter(k=>k.chapter_id===c.id && k.due<=today()).length })).filter(x=>x.n);
      if (!per.length) return "";
      return `<div class="card"><h3>${label}</h3>${per.map(({c,n,due})=>`
        <div class="modrow"><div><b>${esc(c.title)}</b><div class="tiny muted">${n} cartes${due?` · ${due} à revoir`:""}</div></div>
        <div class="row"><button class="small primary" data-cards="${c.id}">Réviser</button><button class="small ghost" data-copy="${c.id}">Copier Q/R</button></div></div>`).join("")}</div>`;
    }
    const list = smods.filter(x=>x.type===type).sort((a,b)=> (chs.findIndex(c=>c.id===a.chapter_id)-chs.findIndex(c=>c.id===b.chapter_id)) || a.level-b.level || a.title.localeCompare(b.title));
    if (!list.length) return "";
    return `<div class="card"><h3>${label} <span class="tiny muted">(${list.length})</span></h3>${list.map(x=>`
      <div class="modrow" data-mod="${x.id}"><div style="min-width:0"><b>${esc(x.title)}</b><div class="tiny muted">${esc(chTitle(x.chapter_id))} · niveau ${x.level}</div></div>
      <div class="row">${type==="fiche"?"":scoreTag(x.id)}<span class="go">▶</span></div></div>`).join("")}</div>`;
  };
  const sections = TYPE_SECTIONS.map(([t,l])=>section(t,l)).join("");
  m.innerHTML = `
  <button class="ghost small" id="back" style="margin-bottom:10px">‹ Toutes les matières</button>
  <div class="card" style="border-left:6px solid ${s.color}">
    <div class="row between"><h2 style="margin:0">${esc(s.name)}</h2><span class="tiny muted">coef ${s.coef}</span></div>
    <div class="tiny muted" style="margin:6px 0 4px">Maîtrise moyenne ${avgOf(chs)}%</div>
    <div class="bar"><i style="width:${avgOf(chs)}%;background:${s.color}"></i></div>
    ${chs.length?`<details style="margin-top:10px"><summary class="tiny"><b>Chapitres (${chs.length})</b></summary>${chs.map(c=>`
      <div class="chapter"><div class="row between"><span>${esc(c.title)}</span><span class="tiny">${c.mastery}%</span></div>
      <div class="bar" style="height:5px;margin:4px 0"><i style="width:${c.mastery}%;background:${s.color}"></i></div>
      <div class="tiny muted">${STAGE_FR[c.stage]} · niveau ${c.level} · ${c.next_review?"à revoir le "+esc(frDay(c.next_review,{day:"numeric",month:"short"})):"jamais révisé"}</div></div>`).join("")}</details>`:""}
  </div>
  ${sections || `<div class="card muted">Pas encore d'exos pour cette matière. Ils apparaîtront ici dès que tu les importes.</div>`}`;
  $("#back").onclick = ()=>{ S.subject = null; render(); };
  m.querySelectorAll("[data-mod]").forEach(el=> el.onclick = ()=> runModule(el.dataset.mod));
  m.querySelectorAll("[data-cards]").forEach(el=> el.onclick = ()=> runCards({ chapterId: el.dataset.cards }));
  m.querySelectorAll("[data-copy]").forEach(el=> el.onclick = async ()=>{
    const cs = await q(sb.from("rev_cards").select("question,answer").eq("chapter_id", el.dataset.copy));
    await navigator.clipboard.writeText(cs.map(c=>`Q: ${c.question}\nR: ${c.answer}`).join("\n\n"));
    toast(`${cs.length} cartes copiées`);
  });
}

/* ================= IMPORT ================= */
const TYPES = ["qcm","exo","flashcards","lecture_quiz","fiche"];
const KINDS = Object.keys(KIND_LABEL);
async function validatePack(p){
  const E = [];
  if (!p || p.format!=="revision-pack") E.push(`"format" doit valoir "revision-pack"`);
  const subs = p.subjects||[], chs = p.chapters||[], mods = p.modules||[], bls = p.blocks||[];
  const existingMods = new Set((await q(sb.from("rev_modules").select("id"))).map(x=>x.id));
  const subIds = new Set([...S.subjects.keys(), ...subs.map(s=>s.id)]);
  const chIds = new Set([...S.chapters.keys(), ...chs.map(c=>c.id)]);
  const modIds = new Set([...existingMods, ...mods.map(x=>x.id)]);
  subs.forEach((s,i)=>{ if(!s.id||!s.name) E.push(`Matière #${i+1} : "id" et "name" obligatoires`); });
  chs.forEach((c,i)=>{ if(!c.id||!c.title) E.push(`Chapitre #${i+1} : "id" et "title" obligatoires`);
    if(!subIds.has(c.subject_id)) E.push(`Chapitre ${c.id} : matière "${c.subject_id}" inconnue`); });
  mods.forEach((x,i)=>{
    const tag = `Module ${x.id||"#"+(i+1)}`;
    if(!x.id||!x.title) E.push(`${tag} : "id" et "title" obligatoires`);
    if(!chIds.has(x.chapter_id)) E.push(`${tag} : chapitre "${x.chapter_id}" inconnu`);
    if(!TYPES.includes(x.type)) E.push(`${tag} : type "${x.type}" invalide (${TYPES.join(", ")})`);
    if(x.level && ![1,2,3].includes(x.level)) E.push(`${tag} : level doit être 1, 2 ou 3`);
    const c = x.content||{};
    if (x.type==="qcm"||x.type==="lecture_quiz"){
      if(!Array.isArray(c.questions)||!c.questions.length) E.push(`${tag} : content.questions vide`);
      else c.questions.forEach((Q,j)=>{
        if(!Q.text) E.push(`${tag} Q${j+1} : "text" manquant`);
        if(!Array.isArray(Q.options)||Q.options.length<2) E.push(`${tag} Q${j+1} : au moins 2 options`);
        if(!Array.isArray(Q.answer)||!Q.answer.length||Q.answer.some(a=>!Number.isInteger(a)||a<0||a>=(Q.options||[]).length)) E.push(`${tag} Q${j+1} : "answer" doit être une liste d'indices valides (0 = A)`);
      });
    }
    if (x.type==="exo"){
      if(!Array.isArray(c.questions)||!c.questions.length) E.push(`${tag} : content.questions vide`);
      else c.questions.forEach((Q,j)=>{ if(!Q.text||!Q.answer) E.push(`${tag} Q${j+1} : "text" et "answer" obligatoires`); });
    }
    if (x.type==="flashcards"){
      if(!Array.isArray(c.cards)||!c.cards.length) E.push(`${tag} : content.cards vide`);
      else c.cards.forEach((k,j)=>{ if(!k.q||!k.a) E.push(`${tag} carte ${j+1} : "q" et "a" obligatoires`); });
    }
    if (x.type==="fiche" && typeof c.html!=="string") E.push(`${tag} : content.html manquant`);
  });
  bls.forEach((b,i)=>{
    const tag = `Bloc ${b.id||"#"+(i+1)}`;
    if(!b.id||!b.label) E.push(`${tag} : "id" et "label" obligatoires`);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(b.day||"")) E.push(`${tag} : "day" au format AAAA-MM-JJ`);
    if(!KINDS.includes(b.kind)) E.push(`${tag} : kind "${b.kind}" invalide (${KINDS.join(", ")})`);
    if(b.priority && !["obligatoire","bonus"].includes(b.priority)) E.push(`${tag} : priority = obligatoire ou bonus`);
    if(b.subject_id && !subIds.has(b.subject_id)) E.push(`${tag} : matière "${b.subject_id}" inconnue`);
    if(b.chapter_id && !chIds.has(b.chapter_id)) E.push(`${tag} : chapitre "${b.chapter_id}" inconnu`);
    if(b.module_id && !modIds.has(b.module_id)) E.push(`${tag} : module "${b.module_id}" inconnu`);
  });
  return { errors:E, counts:{ subjects:subs.length, chapters:chs.length, modules:mods.length,
    cards: mods.filter(x=>x.type==="flashcards").reduce((a,x)=>a+(x.content?.cards?.length||0),0), blocks:bls.length } };
}

async function importPack(p){
  const uid = S.user.id;
  const pick = (o, keys) => Object.fromEntries(keys.filter(k=>o[k]!==undefined).map(k=>[k,o[k]]));
  if (p.subjects?.length) await q(sb.from("rev_subjects").upsert(p.subjects.map(s=>({ ...pick(s,["id","name","family","color","coef","active"]), user_id:uid }))));
  if (p.chapters?.length) await q(sb.from("rev_chapters").upsert(p.chapters.map(c=>({ ...pick(c,["id","subject_id","title","position"]), user_id:uid }))));
  if (p.modules?.length){
    await q(sb.from("rev_modules").upsert(p.modules.map(x=>({ ...pick(x,["id","chapter_id","type","level","title","content"]), user_id:uid }))));
    const cards = p.modules.filter(x=>x.type==="flashcards").flatMap(x=> x.content.cards.map((k,j)=>({
      id: k.id || `${x.id}-${String(j+1).padStart(3,"0")}`, chapter_id:x.chapter_id, module_id:x.id, question:k.q, answer:k.a, user_id:uid })));
    for (let i=0;i<cards.length;i+=200) await q(sb.from("rev_cards").upsert(cards.slice(i,i+200)));
  }
  if (p.blocks?.length) await q(sb.from("rev_blocks").upsert(p.blocks.map(b=>({
    ...pick(b,["id","day","subject_id","chapter_id","module_id","kind","priority","label","method"]),
    start_time: b.start||null, end_time: b.end||null, user_id:uid }))));
}

function viewImport(m){
  m.innerHTML = `
  <div class="card">
    <h2>Importer un pack</h2>
    <p class="tiny muted">Planning, chapitres, QCM, exos, flashcards ou fiches : colle le contenu du fichier que Claude t'a donné, ou choisis le fichier.</p>
    <input type="file" id="file" accept=".json,application/json" style="margin-bottom:8px">
    <textarea id="txt" placeholder='{ "format": "revision-pack", ... }'></textarea>
    <button class="ok" id="go" style="width:100%;margin-top:8px">Importer</button>
    <div id="rep" style="margin-top:10px"></div>
  </div>`;
  const rep = html => { $("#rep").innerHTML = html; };
  $("#file").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { $("#txt").value = await f.text(); rep(`<p class="muted">Fichier chargé : ${esc(f.name)} — appuie sur Importer.</p>`); }
    catch(err){ rep(`<p class="err">Impossible de lire le fichier : ${esc(err.message)}</p>`); }
  };
  $("#go").onclick = async ()=>{
    const btn = $("#go"); btn.disabled = true; btn.textContent = "Import en cours…";
    try {
      const raw = $("#txt").value.trim();
      if (!raw) throw new Error("Aucun contenu : choisis un fichier ou colle le texte.");
      let pack; try { pack = JSON.parse(raw); } catch(e){ throw new Error("Ce n'est pas du JSON valide : " + e.message); }
      const { errors, counts } = await validatePack(pack);
      if (errors.length){ rep(`<p class="err"><b>${errors.length} problème(s) — rien n'a été importé :</b></p><ul class="err">${errors.slice(0,30).map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`); return; }
      await importPack(pack); await loadRefs();
      toast(`Import réussi ✓ ${counts.subjects} matières, ${counts.modules} modules, ${counts.blocks} blocs`);
      S.view="today"; S.day=today(); render();
    } catch(e){
      rep(`<p class="err">Échec : ${esc(e.message || e)}</p>`);
    } finally { if ($("#go")){ btn.disabled = false; btn.textContent = "Importer"; } }
  };
}

/* ================= RESULTS / EXPORT ================= */
function viewResults(m){
  m.innerHTML = `
  <div class="card">
    <h2>Exporter mes résultats</h2>
    <p class="tiny muted">À faire chaque dimanche : envoie le fichier à Claude pour le planning suivant.</p>
    <label class="tiny">Depuis le</label>
    <input type="date" id="since" value="${addDays(today(),-7)}" style="margin-bottom:10px">
    <div class="row"><button class="primary" id="dl">⬇️ Télécharger</button><button id="cp">📋 Copier</button></div>
  </div>
  <div id="summary"></div>`;
  const build = async () => {
    const since = $("#since").value;
    const [blocks, attempts, cards, reviews, habits] = await Promise.all([
      q(sb.from("rev_blocks").select("*").gte("day", since).order("day")),
      q(sb.from("rev_attempts").select("*").gte("created_at", since+"T00:00:00")),
      q(sb.from("rev_cards").select("id,chapter_id,due,interval,reps,lapses")),
      q(sb.from("rev_card_reviews").select("card_id,grade,reviewed_at").gte("reviewed_at", since+"T00:00:00")),
      q(sb.from("rev_habits").select("day,habit,done").gte("day", since))
    ]);
    await loadRefs();
    const cardCh = Object.fromEntries(cards.map(c=>[c.id,c.chapter_id]));
    const cardStats = {};
    cards.forEach(c=>{ const s = cardStats[c.chapter_id] ??= { total:0, due:0, lapses:0, reviews:0, fails:0 };
      s.total++; if (c.due<=today()) s.due++; s.lapses+=c.lapses; });
    reviews.forEach(r=>{ const s = cardStats[cardCh[r.card_id]]; if (s){ s.reviews++; if (r.grade===0) s.fails++; } });
    const vis = blocks.filter(b=>b.status!=="moved" && b.day<=today());
    const obl = vis.filter(b=>b.priority==="obligatoire");
    return {
      format:"revision-results", version:1, exported_at:new Date().toISOString(), period:{ from:since, to:today() },
      summary:{
        blocks_planned: vis.length, blocks_done: vis.filter(b=>b.status==="done").length,
        mandatory_planned: obl.length, mandatory_done: obl.filter(b=>b.status==="done").length,
        skipped: vis.filter(b=>b.status==="skipped").length, still_todo: vis.filter(b=>b.status==="todo").length,
        moved: blocks.filter(b=>b.status==="moved").length,
        calisthenie_days: habits.filter(h=>h.habit==="calisthenie").length, sport_days: habits.filter(h=>h.habit==="sport").length
      },
      subjects:[...S.subjects.values()].map(s=>({ id:s.id, name:s.name, coef:s.coef })),
      chapters:[...S.chapters.values()].map(c=>({ id:c.id, subject_id:c.subject_id, title:c.title, mastery:c.mastery, stage:c.stage, level:c.level, interval_days:c.interval_days, last_review:c.last_review, next_review:c.next_review, cards:cardStats[c.id]||null })),
      blocks: blocks.map(b=>({ id:b.id, day:b.day, kind:b.kind, priority:b.priority, label:b.label, subject_id:b.subject_id, chapter_id:b.chapter_id, module_id:b.module_id, status:b.status, feedback:b.feedback, moved_from:b.moved_from, done_at:b.done_at })),
      attempts: attempts.map(a=>({ module_id:a.module_id, chapter_id:a.chapter_id, block_id:a.block_id, score:a.score, max:a.max_score, pct: a.max_score?Math.round(a.score/a.max_score*100):null, duration_s:a.duration_s, at:a.created_at, details:a.details })),
      habits
    };
  };
  const showSummary = async () => {
    const r = await build(); const s = r.summary;
    const pct = s.mandatory_planned ? Math.round(s.mandatory_done/s.mandatory_planned*100) : 0;
    const weak = r.chapters.filter(c=>c.last_review).sort((a,b)=>a.mastery-b.mastery).slice(0,5);
    $("#summary").innerHTML = `<div class="card"><h2>Résumé de la période</h2>
      <div class="row"><div class="stat"><span class="tiny muted">Obligatoires faits</span><b>${pct}%</b></div>
      <div class="stat"><span class="tiny muted">Blocs faits</span><b>${s.blocks_done}/${s.blocks_planned}</b></div>
      <div class="stat"><span class="tiny muted">QCM / exos</span><b>${r.attempts.length}</b></div></div>
      ${weak.length?`<h3 style="margin-top:14px">Chapitres les plus fragiles</h3>${weak.map(c=>`<div class="row between tiny" style="padding:4px 0"><span>${esc(c.title)}</span><b>${c.mastery}%</b></div>`).join("")}`:""}</div>`;
    return r;
  };
  showSummary();
  $("#since").onchange = showSummary;
  $("#dl").onclick = async ()=>{
    const r = await build();
    const blob = new Blob([JSON.stringify(r, null, 2)], { type:"application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `resultats-${today()}.json`; a.click(); URL.revokeObjectURL(a.href);
  };
  $("#cp").onclick = async ()=>{ const r = await build(); await navigator.clipboard.writeText(JSON.stringify(r)); toast("Résultats copiés — colle-les à Claude"); };
}

/* ================= BOOT ================= */
sb.auth.onAuthStateChange((_e, session) => {
  // setTimeout : évite de bloquer le client Supabase pendant le callback d'auth
  setTimeout(async () => {
    if (session?.user){ if (S.user?.id === session.user.id) return; S.user = session.user; await loadRefs(); render(); }
    else { S.user = null; renderLogin(); }
  }, 0);
});
const { data:{ session } } = await sb.auth.getSession();
if (!session) renderLogin();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
